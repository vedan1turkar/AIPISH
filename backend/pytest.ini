[pytest]
testpaths = tests
pythonpath = .
# Unit + mocked tests never touch the network (pytest-socket). Tests that need
# it opt in with a marker and are skipped unless explicitly requested.
addopts = --disable-socket --allow-unix-socket
markers =
    live: calls a real external provider; runs only with AIPISH_RUN_LIVE=1
    integration: needs local Docker services; runs only with AIPISH_RUN_INTEGRATION=1
