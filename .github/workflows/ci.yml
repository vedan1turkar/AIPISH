# AIPISH CI (P5i): backend tests on SQLite and PostgreSQL, frontend checks, container builds,
# compose validation, secret scan and forbidden-file check. No secrets, no live provider calls,
# no local-only assets (models/dataset): tests that need them skip with an explicit reason.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  backend-sqlite:
    name: backend (SQLite, Python ${{ matrix.python }}, ML stack)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        python: ["3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            backend/constraints.txt
      - name: Install dependencies (CPU-only PyTorch for the optional ML stack)
        run: |
          python -m pip install -r requirements-dev.txt -c constraints.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu \
            "torch==$(grep -i '^torch==' constraints.txt | cut -d= -f3)"
          python -m pip install -r requirements-ml.txt -c constraints.txt
      - name: Test (SQLite; no models, dataset or network)
        run: python -m pytest -q -p no:warnings -rs

  backend-postgres:
    name: backend (PostgreSQL 17)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.12-alpine
        env:
          POSTGRES_USER: aipish_test
          POSTGRES_DB: postgres
          # ephemeral CI service, reachable only from this job: no password needed or stored
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aipish_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            backend/constraints.txt
      - name: Install dependencies (no ML stack; ML tests skip with a reason)
        run: python -m pip install -r requirements-dev.txt -c constraints.txt
      - name: Test against PostgreSQL (dedicated aipish_test database, dropped afterwards)
        env:
          TEST_DATABASE_URL: postgresql://aipish_test@127.0.0.1:5432/aipish_test
        run: python -m pytest -q -p no:warnings -rs --allow-hosts=127.0.0.1

  frontend:
    name: frontend (typecheck, lint, tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npx eslint .
      - run: npm test
      - run: npm run build

  docker:
    name: containers (build, nginx -t, compose config)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build backend image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: false
          tags: aipish-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build web image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          push: false
          load: true
          tags: aipish-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: nginx configuration test inside the web image
        run: docker run --rm --add-host backend:127.0.0.1 aipish-web:ci nginx -t
      - name: Validate docker compose (placeholder values; nothing is started)
        env:
          POSTGRES_PASSWORD: ci-config-check-only
          AIPISH_JWT_SECRET: ci-config-check-only
        run: |
          docker compose -f deploy/docker-compose.yml --env-file deploy/env.example config -q
          docker compose -f deploy/docker-compose.yml --env-file deploy/env.example --profile test config -q
      - name: Compose refuses to run without required secrets
        run: |
          if docker compose -f deploy/docker-compose.yml --env-file deploy/env.example config -q 2>/dev/null; then
            echo "compose accepted an empty POSTGRES_PASSWORD/AIPISH_JWT_SECRET" >&2; exit 1
          fi

  security:
    name: security (secret scan, forbidden files, workflow lint)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Forbidden files are not tracked
        run: scripts/ci/check-forbidden-files.sh
      - name: gitleaks (full history; reviewed false positives in .gitleaksignore)
        run: |
          docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --no-banner --gitleaks-ignore-path /repo/.gitleaksignore
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.12 -color
