# Security headers for the SPA and its assets (P5i). Included per location because nginx's
# add_header in a location replaces the server-level set.
# CSP verified against the production build: no inline scripts; React/Cytoscape set styles through the
# CSSOM (style attributes need 'unsafe-inline' in style-src); fonts are self-hosted; the API is same-origin;
# report PDFs download via blob: URLs.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
